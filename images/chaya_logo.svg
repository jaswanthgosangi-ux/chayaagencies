<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <!-- Cyan Blue Arc Gradient -->
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2BA7D8"/>
      <stop offset="100%" stop-color="#1B9BD0"/>
    </linearGradient>

    <!-- Dark Slate Camera Body -->
    <linearGradient id="slateBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#353A4A"/>
      <stop offset="100%" stop-color="#282C38"/>
    </linearGradient>

    <!-- Lens Glass Reflection Gradient -->
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4A5060"/>
      <stop offset="45%" stop-color="#252933"/>
      <stop offset="85%" stop-color="#12141A"/>
      <stop offset="100%" stop-color="#090A0D"/>
    </radialGradient>
  </defs>

  <!-- Group: Logo Graphic Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer Cyan 'C' Arc -->
    <path d="M 120 10 
             A 100 100 0 1 0 140 160 
             L 140 120 
             A 60 60 0 1 1 120 50 
             Z" 
          fill="url(#cyanArc)"/>

    <!-- Inner Dark Slate Camera Lens Body 'a' shape -->
    <path d="M 140 50 
             A 70 70 0 1 0 140 170 
             L 140 170 
             L 140 50 
             Z" 
          fill="url(#slateBody)"/>

    <!-- Concentric Camera Lens Aperture Rings -->
    <!-- Outer Ring Highlight -->
    <circle cx="85" cy="110" r="48" fill="none" stroke="#D1D5DB" stroke-width="4"/>
    <circle cx="85" cy="110" r="44" fill="none" stroke="#6B7280" stroke-width="3"/>
    
    <!-- Lens Elements Base -->
    <circle cx="85" cy="110" r="41" fill="url(#lensGlass)"/>
    <circle cx="85" cy="110" r="32" fill="none" stroke="#374151" stroke-width="2"/>
    <circle cx="85" cy="110" r="24" fill="#0D0E12"/>
    
    <!-- Reflection Glare Catchlight Dots -->
    <circle cx="76" cy="98" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="94" cy="118" r="3" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Group: Brand Typography (Default Light/White text for Dark Theme Header) -->
  <g transform="translate(230, 45)">
    <!-- CHAYA -->
    <text x="0" y="70" 
          fill="#FFFFFF" 
          font-family="'Space Grotesk', 'Montserrat', 'Inter', sans-serif" 
          font-size="68" 
          font-weight="800" 
          letter-spacing="1">CHAYA</text>
    
    <!-- AGENCIES -->
    <text x="5" y="125" 
          fill="#2BA7D8" 
          font-family="'Space Grotesk', 'Inter', sans-serif" 
          font-size="44" 
          font-weight="700" 
          letter-spacing="7">AGENCIES</text>
  </g>
</svg>
